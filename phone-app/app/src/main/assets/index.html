    // ── turn controller ──
    let pendingWhen = null;    // {kind, partial} while asking "when?"
    let turnActive = false;
    let wakeFired = false;
    let hermesHistory = [];
    let activeHermesProfile = 'root';   // 'fast' | 'root' — which Hermes profile served the last turn
    let wakeFiredAt = 0;                // timestamp when the wake word fired
    let lastHermesLatency = null;       // ms of the last completed Hermes turn

    function startTurn(tail) {
      console.log('[Turn] start' + (tail ? ' tail="' + tail + '"' : ''));
      turnActive = true;
      showTranscript('');
      stopWakeLoop();
      if (tail && tail.trim()) {           // "loona put a reminder" in one breath
        setTimeout(() => handleUtterance(tail.trim()), 400);
        return;
      }
      showTranscript('…');
      // Whisper on the LAN hears Greek far better than the Google recognizer,
      // and the audio never leaves the house. Fall back to Google if it is
      // unreachable or hears nothing.
      const vc = voiceCfg();
      if (isNative() && vc.whisperOn !== false && vc.stt !== 'google') {
        sttPending = true;
        Bridge.call('listen', {
          mode: 'whisper',
          noSpeechMs: vc.whisperNoSpeechMs,
          endMs: vc.whisperEndMs
        }, vc.whisperTimeoutMs)
          .then(() => console.log('[STT] whisper listening'))
          .catch(e => { console.warn('[STT] whisper unavailable:', e); sttPending = false; googleListen(); });
        return;
      }
      googleListen();
    }

    function googleListen() {
      if (!turnActive || appState === 'speaking') return;
      // "conversation" keeps the recognizer re-arming, so a follow-up sentence
      // or a "…when?" answer doesn't need a second wake word.
      Bridge.call('listen', { mode: 'conversation' }, 10000)
        .then(() => console.log('[STT] google listening'))
        .catch(e => console.warn('[STT] listen failed:', e));
    }

    function endTurn() {
      console.log('[Turn] end (active=' + turnActive + ', pending=' + !!pendingWhen + ', sttPending=' + sttPending + ')');
      if (!turnActive && !pendingWhen) { startWakeLoop(); return; }
      turnActive = false;
      pendingWhen = null;
      showTranscript('');
      wakeFired = false;
      startWakeLoop();
    }

    function handleUtterance(text) {
      text = String(text || '').trim();
      if (!text) return;
      showTranscript(text);
      noteActivity();

      // Completing a "…when?" exchange
      if (pendingWhen) {
        const at = PALBrain.parseWhen(text, Date.now()) ||
                   PALBrain.parseWhenGr(text, Date.now());
        if (at) {
          const action = Object.assign({}, pendingWhen.partial,
            { type: pendingWhen.kind, atMs: at });
          pendingWhen = null;
          executeLocal(action);
          return;
        }
        pendingWhen = null;              // not a time — treat as a fresh utterance
      }

      let action = null;
      try { action = PALBrain.parseIntent(text, Date.now()); }
      catch (e) { console.error('[Brain] parse error', e); }

      if (action) { executeLocal(action); return; }
      askHermes(text);
    }

    function executeLocal(action, opts) {
      const silent = !!(opts && opts.silent);
      const confirmed = !!(opts && opts.confirmed);
      if (action.needWhen) {
        pendingWhen = { kind: action.type, partial: action.partial || {} };
        speakLine(PALBrain.askWhenText(action.type, voiceLang()));
        return;
      }

      // Risk-based confirmation: destructive actions need a yes/no tap unless
      // confirmLevel is 'none' (or already confirmed).
      const DESTRUCTIVE = new Set(['reminder', 'alarm', 'timer', 'cancel']);
      const level = uiCfg().confirmLevel;
      const needsConfirm = DESTRUCTIVE.has(action.type) && level !== 'none' && !confirmed;
      if (needsConfirm) {
        const trEl = PALBrain.confirmText(action, Date.now(), voiceLang());
        showCard(action.type, trEl.replace(/\.$/, '') + '?', 'warn', () => {
          executeLocal(action, { silent, confirmed: true });
        });
        return;
      }

      let call = null;
      switch (action.type) {
        case 'reminder':   call = Bridge.call('reminder', { title: action.title, message: action.message, atMs: action.atMs }, 15000); break;
        case 'alarm':      call = Bridge.call('alarm', { title: action.label, message: action.label, atMs: action.atMs }, 15000); break;
        case 'timer':      call = Bridge.call('timer', { title: action.label, message: action.label, ms: action.ms }, 15000); break;
        case 'cancel':     call = Bridge.call('cancel', { kind: action.all ? 'all' : action.kind }, 10000); break;
        case 'torch':      call = Bridge.call('torch', { on: action.on }); break;
        case 'brightness': call = Bridge.call('brightness', { value: action.value, op: action.op }); break;
        case 'volume':     call = Bridge.call('volume', { value: action.value, op: action.op, stream: action.stream }); break;
        case 'openApp':    call = Bridge.call('openApp', { query: action.query }); break;
        case 'settings':   call = Bridge.call('settings', { panel: action.panel }); break;
        case 'battery':    call = Bridge.call('battery', {}); break;
        case 'dial':       call = Bridge.call('dial', { number: action.number, contact: action.contact }); break;
        case 'search':     call = Bridge.call('search', { query: action.query }); break;
        case 'youtube':    call = Bridge.call('youtube', { query: action.query }); break;
        case 'navigate':   call = Bridge.call('navigate', { query: action.query }); break;
        case 'url':        call = Bridge.call('url', { url: action.url }); break;
        case 'media':      call = Bridge.call('media', { op: action.op }); break;
        // No voice API into the music apps, so: open YT Music, then resume.
        case 'music':      call = Bridge.call('openApp', { query: 'YT Music' })
            .then(() => new Promise(r => setTimeout(r, 2800)))
            .then(() => Bridge.call('media', { op: 'play' }))
            .then(() => new Promise(r => setTimeout(r, 1200)))
            .then(() => Bridge.call('media', { op: 'play' })); break;
        case 'notify':     call = Bridge.call('notify', { title: action.title, message: action.title }); break;
        default: break;
      }

      // Preview exactly what was understood, before anything is executed.
      showCard(action.type, PALBrain.confirmText(action, Date.now(), voiceLang()));

      if (!call) {
        if (!silent) speakLine(PALBrain.confirmText(action, Date.now(), voiceLang()));
        else endTurn();
        return;
      }
      call.then(res => {
        let line;
        if (action.type === 'battery') {
          line = res.percent >= 0
            ? tr(`Η μπαταρία είναι ${res.percent} τοις εκατό${res.charging ? ', φορτίζει' : ''}.`,
                 `Battery is ${res.percent} percent${res.charging ? ', charging' : ''}.`)
            : PALBrain.confirmText(action, Date.now(), voiceLang());
        } else if (action.type === 'cancel') {
          line = res.cancelled
            ? PALBrain.confirmText(action, Date.now(), voiceLang())
            : tr('Δεν υπήρχε κάτι να ακυρώσω.', 'There was nothing to cancel.');
        } else {
          line = PALBrain.confirmText(action, Date.now(), voiceLang());
        }
        if (action.type === 'reminder' || action.type === 'alarm' || action.type === 'timer') {
          if (res && res.notificationsEnabled === false) {
            line += tr(' Οι ειδοποιήσεις είναι κλειστές — άνοιξέ τες για να το δεις.',
                       ' Notifications are off, so turn them on for this app.');
          }
        }
        showCard(action.type, line, 'ok');
        if (silent) { console.log('[Action] ' + action.type + ' → ' + line); endTurn(); }
        else speakLine(line);
      }).catch(err => {
        console.warn('[Action] failed:', action.type, err);
        const msg = tr('Δεν τα κατάφερα', "I couldn't do that") +
          (err && err.error ? ' — ' + err.error : '.');
        showCard(action.type, msg, 'err');
        speakLine(msg);
      });
    }

    // Streaming sink: PalBridge pushes each token as a `hermes` event.
    let streamSink = null;
    Bridge.on('hermes', (ev) => {
      if (!streamSink || !ev) return;
      try { streamSink(ev); } catch (e) { /* ignore */ }
    });

    async function askHermes(text) {
      setState('thinking');
      const turnStartAt = performance.now();
      if (wakeFiredAt) {
        console.log('[Lat] wake→transcript ' + Math.round(turnStartAt - wakeFiredAt) + 'ms');
        wakeFiredAt = 0;
      }
      hermesHistory.push({ role: 'user', text: text });
      if (hermesHistory.length > 24) hermesHistory = hermesHistory.slice(-24);

      const cfg = hermesCfg();
      const req = PALBrain.buildRequest(cfg, hermesHistory, { stream: true });
      console.log('[Hermes] → ' + req.url + (req.headers.Authorization.length > 14 ? ' (with key)' : ' (NO KEY)'));

      const t0 = performance.now();
      let firstTokenAt = 0, firstSpeechAt = 0;
      let think = '', answer = '', spokeLen = 0, spokeAny = false;

      // Speak complete sentences as they arrive. The first one starts talking
      // in about a second instead of waiting for the whole answer.
      const say = (final) => {
        const safe = answer.split('@@ACTION')[0];
        const cut = final ? safe.length : sentenceCut(safe);
        if (cut <= spokeLen) return;
        const chunk = safe.slice(spokeLen, cut).trim();
        if (!chunk) { spokeLen = cut; return; }
        if (!final && chunk.length < 12) return;      // too short to be a sentence
        spokeLen = cut;
        if (!spokeAny) {
          showReply(safe);
          setState('speaking');
          setMood(moodFromText(chunk));
          stopWakeLoop();
          wakeLoopOn = false;
          ttsPending = 0;
          firstSpeechAt = performance.now();
          console.log('[Lat] speech started ' + Math.round(firstSpeechAt - t0) + 'ms after request');
        }
        speakChunk(chunk, !spokeAny);
        spokeAny = true;
        showReply(safe);
      };

      streamSink = (ev) => {
        if (ev.kind === 'reasoning') {
          think += ev.delta || '';
          showThinking(think);
        } else if (ev.kind === 'content') {
          answer += ev.delta || '';
          if (!firstTokenAt && answer.trim()) {
            firstTokenAt = performance.now();
            console.log('[Lat] first token ' + Math.round(firstTokenAt - t0) + 'ms');
          }
          if (answer.trim()) { showThinking(''); showReply(answer); }
          say(false);
        }
      };

      // Try fast profile first, root as fallback. Max two attempts total.
      // Never logs or surfaces API keys.
      let res = null;
      activeHermesProfile = 'root';

      for (let attempt = 0; attempt < 2 && !res; attempt++) {
        const useFast = attempt === 0 && cfg.pathPrefix;
        const attemptCfg = useFast ? cfg : Object.assign({}, cfg, { pathPrefix: '', keyFast: undefined });
        activeHermesProfile = useFast ? 'fast' : 'root';
        const r = PALBrain.buildRequest(attemptCfg, hermesHistory, { stream: true });
        console.log('[Hermes] → ' + r.url + (r.headers.Authorization.length > 14 ? ' (with key)' : ' (NO KEY)'));

        // 1. Try streaming.
        let s = null;
        try {
          s = await Bridge.call('stream', { url: r.url, headers: r.headers, body: r.body }, 125000);
        } catch (e) {
          /* stream threw — try http below */
        }
        // Stream may resolve with status 0 on connection error → try http.
        if (!s || s.status === 0) {
          try {
            const plain = PALBrain.buildRequest(attemptCfg, hermesHistory, { stream: false });
            const raw = await Bridge.call('http', { url: plain.url, method: 'POST', headers: plain.headers, body: plain.body }, 95000);
            s = { status: raw.status, text: '', body: raw.body, reasoning: '' };
          } catch (e2) {
            if (useFast) continue;            // try root on next iteration
            streamSink = null; showThinking('');
            speakLine("I can't reach my brain right now — is Hermes running on the NUC?");
            return;
          }
        }

        // Auth errors: fall back to root if we're on fast; otherwise surface.
        if (s.status === 401 || s.status === 403) {
          if (useFast) { console.warn('[Hermes] fast failed → root fallback'); continue; }
          showThinking('');
          const r2 = PALBrain.parseReply(s.status, s.body || '');
          speakLine(r2.text);
          return;
        }

        res = s;
        lastHermesLatency = Math.round(performance.now() - t0);
        console.log('[Lat] turn total ' + lastHermesLatency + 'ms (profile=' + activeHermesProfile + ')');
      }

      if (!res) {
        streamSink = null; showThinking('');
        speakLine("I can't reach my brain right now — is Hermes running on the NUC?");
        return;
      }
      streamSink = null;

      const status = res && res.status ? res.status : 0;
      const full = ((res && res.text) || answer || '').trim();
      const reasoning = ((res && res.reasoning) || think || '').trim();

      if (status && (status < 200 || status > 299)) {
        showThinking('');
        const r = PALBrain.parseReply(status, (res && res.body) || '');
        speakLine(r.text);
        return;
      }
      if (!full) {
        showThinking('');
        speakLine(reasoning ? "I thought about it but didn't land on an answer."
          : "I couldn't reach my brain right now — is Hermes running on the NUC?");
        return;
      }

      // The model may end its reply with "@@ACTION {...}" to drive the phone.
      const split = PALBrain.splitAction(full);
      const spoken = split.text.trim();
      if (spoken) hermesHistory.push({ role: 'assistant', text: spoken });

      const action = split.action ? PALBrain.normalizeAction(split.action, Date.now()) : null;
      showThinking('');

      if (action) {
        console.log('[Hermes] action ' + JSON.stringify(action));
        // The action happens as soon as the sentence about it is out.
        setTimeout(() => executeLocal(action, { silent: true }), spokeAny ? 120 : 0);
        if (spokeAny) {
          say(true);                     // flush whatever is left unsaid
          if (!spoken) speakChunk(PALBrain.confirmText(action, Date.now(), voiceLang()), ttsPending === 0);
        } else {
          speakLine(spoken || PALBrain.confirmText(action, Date.now(), voiceLang()));
        }
        return;
      }

      if (spokeAny) { say(true); return; }
      speakLine(spoken || 'Okay.');
    }

    // Caption + TTS + mood; the turn ends when TTS reports done.
    function speakLine(text) {
      showReply(text);
      console.log('[Loona] ' + text);
      if (!Bridge.has()) {
        setState('speaking');
        setMood(moodFromText(text));
        const ms = Math.min(7000, 900 + text.length * 55);
        setTimeout(() => { if (appState === 'speaking') setState('idle'); endTurn(); }, ms);
        return;
      }
      setState('speaking');
      setMood(moodFromText(text));
      showThinking('');
      // Close the mic before talking, or the robot transcribes itself.
      // Clearing the flag matters: without it startWakeLoop() thinks the loop
      // is still armed and the wake word never comes back a second time.
      wakeLoopOn = false;
      Bridge.call('stopListen', {}, 5000).catch(() => {});
      ttsPending = 0;
      speakChunk(text, true);
    }

    /* Streaming speech: the answer is spoken sentence by sentence while the
       rest of it is still arriving, instead of after the model finishes. */
    let ttsPending = 0;

    function speakChunk(text, first) {
      const t = String(text || '').trim();
      if (!t) return;
      ttsPending++;
      Bridge.call('speak', { text: t, queue: first ? 'flush' : 'add' }, 180000)
        .catch(e => {
          console.warn('[TTS] chunk failed:', e);
          ttsPending = Math.max(0, ttsPending - 1);
          if (ttsPending === 0 && appState === 'speaking') setState('idle');
        });
    }

    function sentenceCut(s) {
      let cut = 0;
      const re = /[.!?…;·\n]/g;
      let m;
      while ((m = re.exec(s)) !== null) cut = m.index + 1;
      return cut;
    }

    // ── continuous wake loop (native speech path) ──
    let wakeLoopOn = false;
    let wakeLoopRetries = 0;
    const WAKE_LOOP_MAX_RETRIES = 5;
    // A whisper request is in flight: the answer arrives a beat after you stop
    // talking, so the turn must not be torn down in the meantime.
    let sttPending = false;
    function startWakeLoop(retry = false) {
      if (!isNative() || WAKE_MODE === 'envelope') return;
      if (wakeLoopOn || turnActive) return;
      wakeFired = false;
      if (!wakeEnabled) return;
      if (appState !== 'idle' && appState !== 'sleeping') return;
      Bridge.call('listen', { mode: 'loop' }, 10000)
        .then(() => {
          wakeLoopOn = true;
          wakeLoopRetries = 0;
          console.log('[WakeLoop] speech loop armed' + (retry ? ' (retry #' + wakeLoopRetries + ')' : ''));
        })
        .catch(e => {
          console.warn('[WakeLoop] start failed:', e);
          if (!retry && wakeLoopRetries < WAKE_LOOP_MAX_RETRIES) {
            wakeLoopRetries++;
            console.log('[WakeLoop] retrying in 2s (attempt ' + wakeLoopRetries + '/' + WAKE_LOOP_MAX_RETRIES + ')');
            setTimeout(() => startWakeLoop(true), 2000);
          } else {
            console.warn('[WakeLoop] max retries reached — wake word unavailable until tap');
            showBanner('Wake word unavailable — tap the screen to listen');
          }
        });
    }
    function stopWakeLoop() {
      if (!wakeLoopOn) { return; }
      wakeLoopOn = false;
      Bridge.call('stopListen', {}, 5000).catch(() => {});
    }

    // ── native events ──
    Bridge.on('speech', (ev) => {
      if (ev.type === 'final') console.log('[STT] heard: ' + ev.text);
      if (ev.type === 'partial') {
        if (turnActive) showTranscript(ev.text || '');
        else if (!wakeFired) {
          // Fire on a partial that already contains the wake token — this is
          // much faster and more reliable than waiting for the recognizer's
          // final, which often never arrives for a short Greek word.
          const _sw = PALBrain.splitWake(ev.text || '');
          if (_sw.wake) { wakeFired = true; onWakeWord('partial', _sw.rest); }
        }
        return;
      }
      if (!ev.type) return;
      if (ev.type === 'final') {
        sttPending = false;
        sttHardErrors = 0;
        envelopeFallback = false;                    // real words are back
        if (appState === 'speaking') return;          // our own voice, ignore
        if (turnActive && (appState === 'listening' || appState === 'waking' || appState === 'thinking')) {
          handleUtterance(ev.text);
          return;
        }
        if (!turnActive) {                       // wake loop running
          const sw = PALBrain.splitWake(ev.text || '');
          if (sw.wake) onWakeWord('speech', sw.rest);
        }
        return;
      }
      if (ev.type === 'empty') {
        // Whisper heard nothing — let the phone's own recognizer try once.
        sttPending = false;
        if (turnActive) googleListen();
        return;
      }
      if (ev.type === 'error') {
        // 8 = whisper unreachable/failed → same fallback
        if (ev.code === 8) {
          sttPending = false;
          if (turnActive) googleListen();
          return;
        }
        // 6/7 = "nothing said" — normal while waiting for a wake word
        if (ev.code === 7 || ev.code === 6) return;
        // Only genuine engine failures count — ERROR_CLIENT (5) is a restart
        // race, not a missing recognizer, and must not disable the wake word.
        if (ev.code === 1 || ev.code === 2 || ev.code === 3) sttHardErrors++;
        else if (ev.code === 5) sttHardErrors = 0;
        if (sttHardErrors >= 4 && !envelopeFallback) {
          envelopeFallback = true;
          console.warn('[STT] failing — falling back to envelope wake detection');
          // STT is broken: stop the broken loop and retry the wake loop once STT recovers.
          if (wakeLoopOn) { stopWakeLoop(); }
          if (wakeLoopRetries < WAKE_LOOP_MAX_RETRIES) {
            wakeLoopRetries++;
            setTimeout(() => startWakeLoop(true), 3000);
          }
        }
        console.warn('[STT] error', ev.code, ev.message);
      }
    });

    // Voice levels from the native recognizer keep the face alive
    Bridge.on('level', (ev) => { onNativeLevel(ev && ev.level); });

    // A reminder/alarm that fired while the app is open
    Bridge.on('alert', () => { showThinking(''); });

    Bridge.on('tts', (ev) => {
      if (ev.type === 'start') {
        if (appState !== 'speaking') setState('speaking');
        setMood(moodFromText(replyEl ? replyEl.textContent : ''));
      }
      if (ev.type === 'done' || ev.type === 'error') {
        ttsPending = Math.max(0, ttsPending - 1);
        // More sentences are still queued or being spoken.
        if (ttsPending > 0) return;
        if (sttPending) {
          // Still transcribing what was said — don't close the turn on it.
          if (appState === 'speaking') setState('listening');
          return;
        }
        if (appState === 'speaking') setState('idle');
        setTimeout(endTurn, 200);
      }
    });

    Bridge.on('alert', (ev) => {
      if (ev && ev.title) {
        showReply(ev.kind === 'timer' ? '⏱ ' + ev.title : '🔔 ' + ev.title);
        playLocalAck();
        noteActivity();
      }
    });

    // Surface native permissions/config once at boot
    if (isNative()) {
      applyVoiceConfig();          // language + on-device privacy for STT/TTS
      applyUi();                   // face zoom, clock, kiosk, dimming, wake on/off
      Bridge.call('status', {}, 8000).then(st => {
        console.log('[Bridge] status ' + JSON.stringify(st));
        if (st && st.notifications === false) console.warn('[Bridge] notifications disabled');
        if (st && st.exactAlarms === false) console.warn('[Bridge] exact alarms not granted');
        if (st && st.writeSettings === false) console.warn('[Bridge] write settings not granted');
      }).catch(() => {});
    }

    /* ══════════════════════════════════════════════════════════════
       7. SOCKET.IO (optional — the legacy port-5000 server. Down ⇒
       Loona still works standalone through the native brain.)
       ══════════════════════════════════════════════════════════════ */

    const SERVER_URL = '';
    let socket = null;

    if (typeof io === 'function') {
      try {
        socket = io(SERVER_URL, { transports: ['websocket', 'polling'], reconnection: false });
        window.socket = socket;
      } catch (e) {
        console.warn('[Socket] init failed, standalone mode:', e);
        socket = null;
      }
    } else {
      console.warn('[Socket] library missing, standalone mode');
    }

    if (socket) {
    socket.on('connect', () => {
      console.log('[Socket] Connected to', SERVER_URL);
      if (appState === 'dead') { setState('idle'); setMood('neutral'); }
      startMicStreamFromExisting();
    });

    socket.on('disconnect', () => {
      console.log('[Socket] Disconnected — standalone mode');
      stopMicStream();
      // NOTE: no more setState('dead') — the native brain keeps Loona alive.
    });

    socket.on('play_ack', () => {
      noteActivity();
      setMood('excited');
      setTimeout(() => {
        if (appState === 'idle') setMood('neutral');
        else if (appState === 'listening') setMood('attentive');
      }, 1200);
    });

    socket.on('show_book', () => {
      noteActivity();
      if (appState === 'idle' || appState === 'listening') setState('thinking');
    });

    socket.on('play_audio', (data) => {
      noteActivity();
      if (data && data.url) playSound(SERVER_URL + data.url, data.text);
    });

    socket.on('wake_detected', () => onWakeWord('server'));
    socket.on('start_listening', () => { noteActivity(); setState('listening'); });
    socket.on('stop_listening', () => { if (appState === 'listening') setState('idle'); });
    socket.on('thinking', () => setState('thinking'));
    socket.on('speaking', () => setState('speaking'));
    socket.on('done_speaking', () => { if (appState === 'speaking') setState('idle'); });

    socket.on('request_capture', () => {
      // Look into the camera for the photo, then smile about it
      if (appState !== 'speaking') {
        gazeTX = 0; gazeTY = 0;
        setMood('attentive');
      }
      if (!video.videoWidth || !video.videoHeight) {
        socket.emit('client_frame', { image: null });
        return;
      }
      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
      socket.emit('client_frame', {
        image: canvas.toDataURL('image/jpeg', 0.8).split(',')[1]
      });
    });
    } // end if (socket)

    /* ══════════════════════════════════════════════════════════════
       8. MICROPHONE STREAMING TO THE SERVER
       ══════════════════════════════════════════════════════════════ */

    let mediaRecorder = null;

    function startMicStreamFromExisting() {
      if (mediaRecorder || !micStream || !socket) return;
      try {
        mediaRecorder = new MediaRecorder(micStream, { mimeType: 'audio/webm;codecs=opus' });

        mediaRecorder.ondataavailable = (e) => {
          if (e.data.size > 0 && socket && socket.connected) {
            const reader = new FileReader();
            reader.onloadend = () => {
              socket.emit('client_audio', { audio: String(reader.result).split(',')[1] });
            };
            reader.readAsDataURL(e.data);
          }
        };
        mediaRecorder.onerror = (e) => console.error('[Mic] Recorder error:', e);
        mediaRecorder.start(250);
        console.log('[Mic] Streaming to server');
      } catch (err) {
        console.error('[Mic] Recorder start failed:', err);
        mediaRecorder = null;
      }
    }

    function stopMicStream() {
      if (mediaRecorder) {
        try { mediaRecorder.stop(); } catch (e) {}
        mediaRecorder = null;
      }
    }

    /* ══════════════════════════════════════════════════════════════
       9. UNLOCK — native app unlocks at boot, browser needs a gesture.
       The native flag is injected in onPageStarted (BEFORE this script runs),
       so the boot path is trustworthy. If the mic still refuses to start, say
       so on the banner and allow a tap retry — silent failure was the old bug.
       ══════════════════════════════════════════════════════════════ */

    let unlocked = false;
    const banner = document.getElementById('status-banner');

    function isNative() { return window.isNativeApp === true; }

    function showBanner(text) {
      if (!banner) return;
      banner.textContent = text;
      banner.style.display = 'block';
    }
    function hideBanner() {
      if (banner) banner.style.display = 'none';
    }

    async function attemptUnlock(reason) {
      if (unlocked) return;
      unlocked = true;
      console.log('[Unlock] ' + reason);

      await initAudio();                       // sets audioReady on success

      if (audioReady && audioCtx && audioCtx.state === 'suspended') {
        try { await audioCtx.resume(); } catch (e) { /* gesture needed */ }
      }

      // In the native app the recognizer holds the mic, so there is no
      // WebAudio context to check — audioReady is the whole story.
      const micOk = isNative()
        ? audioReady
        : (audioReady && audioCtx && audioCtx.state !== 'suspended');

      if (!micOk) {
        unlocked = false;                      // allow the next tap to retry
        showBanner('Tap anywhere to enable the microphone');
        console.warn('[Unlock] mic not ready (audioReady=' + audioReady +
          ', ctx=' + (audioCtx ? audioCtx.state : 'none') + ')');
        return;
      }

      hideBanner();
      console.log('[Unlock] microphone ready' + (audioCtx ? ', state=' + audioCtx.state : ' (native)'));
      if (!isNative() && document.body.requestFullscreen) {
        document.body.requestFullscreen().catch(() => {});
      }
      if (isNative()) startWakeLoop();   // arm the speech wake path
    }

    if (isNative()) {
      attemptUnlock('native boot');
    } else {
      // The WebView injects window.isNativeApp around page load; if it lands a
      // hair after this script parses, catch it here instead of waiting for a tap.
      let tries = 0;
      const flagPoll = setInterval(() => {
        if (isNative()) {
          clearInterval(flagPoll);
          attemptUnlock('native flag (late)');
        } else if (++tries > 20) {
          clearInterval(flagPoll);
          showBanner('Tap anywhere to enable camera & microphone');
        }
      }, 100);
    }

    // Any tap is a valid unlock gesture (also the fallback for a failed boot).
    document.addEventListener('click', () => {
      const silent = new Audio('data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA');
      silent.play().catch(() => {});
      attemptUnlock('tap');
    });

    // Keep the microphone alive if the WebView suspends the audio context
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) return;
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
      }
      if (!unlocked && isNative()) attemptUnlock('app resume');
    });

    requestAnimationFrame(faceFrame);
  </script>
</body>
</html>
